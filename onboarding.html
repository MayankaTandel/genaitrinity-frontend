<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Set up your profile — AI Fitness Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
<style>
  .onboard-shell { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .onboard-card { width: 100%; max-width: 460px; }
  .onboard-eyebrow { color: var(--growth); font-weight: 700; font-size: 12.5px; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 8px; }
</style>
</head>
<body>

<div class="onboard-shell">
  <div class="card onboard-card fade-in">
    <div class="onboard-eyebrow">Step 1 of 1</div>
    <div style="display:flex; align-items:center; gap:10px; margin-bottom:14px;">
      <span class="auth-mark" style="width:30px;height:30px;border-radius:9px;"></span>
      <h2 style="font-size:22px;">Welcome to Vital</h2>
    </div>
    <p style="color:var(--muted); font-size:13.5px; margin-top:-8px; margin-bottom:24px;">
      Tell us about you so we can calculate your daily calorie target and BMI.
    </p>
    <p style="margin-top:-16px; margin-bottom:24px;">
      <a href="profiles.html" style="font-size:12.5px; color:var(--focus); text-decoration:none;">&larr; Not you? Switch profile</a>
    </p>

    <div class="error-banner" id="errorBanner"></div>

    <form id="onboardForm">
      <div class="field">
        <label for="name">Your name</label>
        <input class="input" type="text" id="name" required placeholder="Alex Rivera" />
      </div>

      <div class="row-2">
        <div class="field">
          <label for="age">Age</label>
          <input class="input" type="number" id="age" min="10" max="100" required placeholder="27" />
        </div>
        <div class="field">
          <label>Gender</label>
          <select class="input" id="gender">
            <option value="other">Prefer not to say</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
          </select>
        </div>
      </div>

      <div class="row-2">
        <div class="field">
          <label for="height">Height (cm)</label>
          <input class="input" type="number" id="height" min="100" max="250" required placeholder="170" />
        </div>
        <div class="field">
          <label for="weight">Weight (kg)</label>
          <input class="input" type="number" id="weight" min="25" max="300" step="0.1" required placeholder="68" />
        </div>
      </div>

      <div class="field">
        <label>Your goal</label>
        <div class="goal-grid">
          <div>
            <input type="radio" name="goal" id="goalLose" value="lose" checked />
            <label class="goal-card" for="goalLose"><span class="emoji">🔥</span><span class="lbl">Lose weight</span></label>
          </div>
          <div>
            <input type="radio" name="goal" id="goalMaintain" value="maintain" />
            <label class="goal-card" for="goalMaintain"><span class="emoji">⚖️</span><span class="lbl">Maintain</span></label>
          </div>
          <div>
            <input type="radio" name="goal" id="goalGain" value="gain" />
            <label class="goal-card" for="goalGain"><span class="emoji">💪</span><span class="lbl">Gain weight</span></label>
          </div>
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Start tracking</button>
    </form>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script>
  if (!getActiveProfileId()) {
    window.location.href = "profiles.html";
  }

  // If already onboarded, skip straight to dashboard
  api("/profile").then((data) => {
    if (data.user && data.user.onboarded) window.location.href = "dashboard.html";
    else if (data.user && data.user.name) document.getElementById("name").value = data.user.name;
  }).catch(() => {});

  const form = document.getElementById("onboardForm");
  const errorBanner = document.getElementById("errorBanner");
  const submitBtn = document.getElementById("submitBtn");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorBanner.classList.remove("show");
    submitBtn.disabled = true;
    submitBtn.innerHTML = '<span class="spinner"></span> Saving…';

    const name = document.getElementById("name").value.trim();
    const age = Number(document.getElementById("age").value);
    const gender = document.getElementById("gender").value;
    const heightCm = Number(document.getElementById("height").value);
    const weightKg = Number(document.getElementById("weight").value);
    const goal = document.querySelector('input[name="goal"]:checked').value;

    try {
      await api("/profile", { method: "PUT", body: { name, age, gender, heightCm, weightKg, goal } });
      window.location.href = "dashboard.html";
    } catch (err) {
      errorBanner.textContent = err.message;
      errorBanner.classList.add("show");
      submitBtn.disabled = false;
      submitBtn.textContent = "Start tracking";
    }
  });
</script>
</body>
</html>
